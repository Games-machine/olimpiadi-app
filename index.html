<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Olimpiadi</title>
<link rel="stylesheet" href="css/stile.css">
</head>
<body>
<header>
  <h1>🏅 Olimpiadi</h1>
  <nav>
    <button data-schermata="gara" class="attivo">Gara</button>
    <button data-schermata="campionato">Campionato</button>
    <button data-schermata="atleti">Atleti</button>
    <button data-schermata="squadre">Squadre</button>
    <button data-schermata="albo">Albo d'oro</button>
  </nav>
</header>

<main>
  <section id="gara" class="schermata attiva">
    <div class="barra">
      <label>Disciplina <select id="sel-disciplina"><option value="">🎲 Casuale</option></select></label>
      <label id="lbl-categoria">Categoria <select id="sel-categoria"><option value="M">♂ Uomini</option><option value="F">♀ Donne</option></select></label>
      <label id="lbl-circuito" class="nascosto">Circuito <select id="sel-circuito"><option value="">🎲 Casuale</option></select></label>
      <label id="lbl-pista" class="nascosto">Pista <select id="sel-pista"><option value="">🎲 Casuale</option></select></label>
      <button id="btn-nuova-gara" class="primario">▶ Nuova gara</button>
      <label>Seme <span class="gruppo"><input id="inp-seme" type="number" placeholder="casuale" style="width:9em"><button type="button" id="btn-seme-dado" title="Estrai un seme a caso">🎲</button></span></label>
      <button id="btn-rigioca">↻ Rigioca</button>
    </div>
    <div id="cartellone" class="cartellone nascosto"></div>
    <div id="slot-arena-gara" class="slot-arena">
    <div id="arena" class="arena nascosto">
      <div class="titolo-gara" id="titolo-gara"></div>
      <canvas id="canvas-pista"></canvas>
      <div class="controlli">
        <button id="btn-via" class="primario">▶ Via!</button>
        <button id="btn-pausa">⏸ Pausa</button>
        <span class="gruppo">Velocità
          <button data-vel="0.25">¼×</button><button data-vel="1" class="attivo">1×</button><button data-vel="4">4×</button>
        </span>
        <button id="btn-salta">⏭ Risultato</button>
        <span class="gruppo"><button id="btn-voce">🔇 Cronaca</button><select id="sel-voce" class="nascosto"></select></span>
        <span id="avviso-voce" class="muto piccolo"></span>
        <button id="btn-prossima" class="primario nascosto">▶ Prossima gara</button>
      </div>
    </div>
    <div id="risultato"></div>
    <div id="podio" class="podio nascosto"></div>
    </div>
  </section>

  <section id="campionato" class="schermata">
    <div id="campionato-nuovo">
      <h2>Nuovo campionato</h2>
      <p class="muto">Partecipano i piloti che hanno una scuderia in questo momento: le formazioni restano bloccate fino alla fine del campionato.</p>
      <div id="tappe-scelta" class="tappe-scelta"></div>
      <div class="barra">
        <label><input type="checkbox" id="chk-mescola"> Ordine casuale delle tappe</label>
        <label>Seme <span class="gruppo"><input id="inp-seme-camp" type="number" placeholder="casuale" style="width:9em"><button type="button" id="btn-seme-camp-dado" title="Estrai un seme a caso">🎲</button></span></label>
        <button id="btn-crea-campionato" class="primario">🏁 Crea campionato</button>
      </div>
      <p id="campionato-avviso" class="avviso"></p>
    </div>
    <div id="campionato-corso" class="nascosto">
      <div class="cartellone" id="campionato-testa"></div>
      <div id="slot-arena-campionato" class="slot-arena"></div>
      <div id="campionato-classifiche"></div>
      <div class="barra"><button id="btn-abbandona-campionato" class="pericolo">Abbandona campionato</button></div>
    </div>
  </section>

  <section id="atleti" class="schermata">
    <div class="barra">
      <button id="btn-nuovo-atleta" class="primario">+ Nuovo atleta</button>
      <button id="btn-esempio">Popola con esempi</button>
      <button id="btn-azzera" class="pericolo">Azzera tutto</button>
    </div>
    <div id="filtri-atleti" class="filtri"></div>
    <div id="blocco-scuderie" class="nascosto">
      <div class="barra">
        <h2>Scuderie</h2>
        <button id="btn-nuova-scuderia">+ Scuderia</button>
        <span class="gruppo"><button id="btn-scuderia-casuale">🎲 Scuderia casuale</button><select id="sel-fascia-sc" title="Livello dell'auto generata"></select></span>
        <button id="btn-assegna-liberi" title="Mette i piloti senza scuderia nei sedili vuoti, i migliori alle auto migliori">Assegna piloti liberi</button>
      </div>
      <div id="lista-scuderie" class="lista"></div>
      <h2>Piloti</h2>
    </div>
    <div id="lista-atleti" class="lista"></div>
  </section>

  <section id="squadre" class="schermata">
    <div class="barra">
      <button id="btn-nuova-squadra" class="primario">+ Nuova squadra</button>
      <span class="gruppo"><button id="btn-squadra-casuale">🎲 Squadra casuale</button><select id="sel-fascia" title="Livello della squadra generata"></select></span>
    </div>
    <div id="lista-squadre" class="lista"></div>
  </section>

  <section id="albo" class="schermata">
    <div id="filtri-albo" class="filtri"></div>
    <div id="lista-albo"></div>
  </section>
</main>

<dialog id="dlg-scheda">
  <form method="dialog" id="form-scheda">
    <h2 id="dlg-titolo">Scheda</h2>
    <label>Nome <input name="nome" required></label>
    <label id="dlg-nazione">Nazione <select name="nazione"></select></label>
    <label id="dlg-disciplina">Disciplina <select name="disciplina"></select></label>
    <label id="dlg-sesso">Categoria <select name="sesso"><option value="M">♂ Uomini</option><option value="F">♀ Donne</option></select></label>
    <label id="dlg-ruolo">Ruolo <select name="ruolo"></select></label>
    <label id="dlg-colore">Colore <input type="color" name="colore" value="#e11d48"></label>
    <div id="dlg-caratteristiche"></div>
    <menu>
      <button type="button" id="btn-casuale" class="sinistra">🎲 Casuale</button>
      <button value="annulla" formnovalidate>Annulla</button>
      <button value="ok" class="primario">Salva</button>
    </menu>
  </form>
</dialog>

<script type="module" src="js/app.js"></script>
</body>
</html>
